name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # A tag v1.2.3 builds version 1.2.3; everything else gets a throwaway CI version.
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        shell: bash
        run: dotnet test OpenPedalControl.slnx --configuration Release -p:Version=${{ steps.version.outputs.value }}

      # Installer with the optional vJoy driver (Inno Setup is preinstalled on GitHub's Windows runners).
      - name: Build installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Collect files
        shell: bash
        run: |
          mkdir -p dist/portable
          cp src/OpenPedalControl/bin/Release/net48/OpenPedalControl.exe LICENSE README.md dist/portable/
          cp installer/output/OpenPedalControl-Setup-*.exe dist/

      - uses: actions/upload-artifact@v7
        with:
          name: OpenPedalControl
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: OpenPedalControl
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          (cd portable && zip -r "../OpenPedalControl-${GITHUB_REF_NAME}-portable.zip" .)
          gh release create "$GITHUB_REF_NAME" \
            OpenPedalControl-Setup-*.exe \
            "OpenPedalControl-${GITHUB_REF_NAME}-portable.zip" \
            portable/OpenPedalControl.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "OpenPedalControl ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
